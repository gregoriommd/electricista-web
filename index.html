<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montoya Electricidad</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1a1a1a;
            border-bottom: 2px solid #cc0000;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-container img {
            height: 60px; /* Ajusté la altura para que el logo se vea mejor */
            width: auto;
            object-fit: contain; /* Mantiene la proporción del logo */
            background-color: transparent; /* Fondo transparente */
        }
        .logo-container h1 {
            font-size: 1.5rem;
            color: #ffffff;
            margin: 0;
        }
        nav a {
            color: #e0e0e0;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }
        nav a:hover {
            color: #cc0000;
        }
        .hero {
            text-align: center;
            padding: 80px 20px;
        }
        .hero h2 {
            font-size: 2.5rem;
            color: #ff3333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Asegurate de guardar la imagen del logo en tu repositorio con el nombre exacto: "montoya electricidad.png" -->
            <img src="montoya electricidad.png" alt="Montoya Electricidad Logo">
            <h1>Montoya Electricidad</h1>
        </div>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#servicios">Servicios</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Instalaciones y Servicios Eléctricos Profesionales</h2>
        <p>Soluciones seguras y eficientes para hogares y comercios.</p>
    </section>

</body>
</html>
